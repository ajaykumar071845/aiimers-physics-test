<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1324" />
<title>AIIMERS CLASSES - Objective Test</title>
<style>
  :root{
    --navy:#0b1324;
    --navy2:#111c34;
    --panel:#141f39;
    --panel2:#1a2745;
    --gold:#f0c86a;
    --gold2:#d9ab43;
    --text:#eef3fb;
    --muted:#9caac3;
    --line:#2d3c5d;
    --blue:#4ea1ff;
    --green:#2bc48a;
    --red:#ff6676;
    --yellow:#f0c86a;
    --purple:#8a7dff;
    --white:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:#e9edf4;color:#111}
  body{overflow-x:auto}
  button,input{font:inherit}
  .app{min-width:1120px;min-height:100vh;background:#edf1f6}
  .topbar{
    height:76px;background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:var(--text);display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;border-bottom:1px solid #24324f;box-shadow:0 8px 24px rgba(9,19,36,.15);
    position:sticky;top:0;z-index:10
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#f6d98c,#bd8f2f);display:grid;place-items:center;color:#0b1324;font-weight:900;box-shadow:0 6px 20px rgba(240,200,106,.2)}
  .brand-title{font-weight:800;letter-spacing:.5px;font-size:20px}
  .brand-dir{font-size:12px;color:#b8c4d9;margin-top:3px}
  .header-right{display:flex;align-items:center;gap:18px}
  .mini-label{font-size:11px;color:#90a0bb;letter-spacing:1.2px;text-transform:uppercase}
  .timer{min-width:142px;padding:9px 13px;border:1px solid #36486b;background:#0e1930;border-radius:12px;text-align:center;box-shadow:inset 0 1px rgba(255,255,255,.03)}
  .timer-value{font-family:"Roboto Mono",Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:1px}
  .submit-top{border:1px solid #b08a34;background:linear-gradient(135deg,#f0c86a,#cf9f35);color:#172035;font-weight:800;padding:11px 16px;border-radius:10px;cursor:pointer;box-shadow:0 6px 15px rgba(201,160,59,.18)}
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:18px;max-width:1500px;margin:auto}
  .main-panel,.side-panel{background:#fff;border:1px solid #d9dfeb;border-radius:16px;box-shadow:0 10px 30px rgba(24,39,72,.08)}
  .main-panel{padding:18px}
  .test-meta{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 16px;border-bottom:1px solid #e4e8f0}
  .meta-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;background:#f3f6fb;border:1px solid #e1e7f1;color:#3a465b}
  .pill strong{color:#13223c}
  .question-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:20px 2px 16px}
  .q-number{font-size:14px;font-weight:800;color:#73809a;letter-spacing:.4px}
  .q-mark{font-size:12px;font-weight:800;color:#2d3b55;background:#f4f7fb;border:1px solid #dfe6f0;border-radius:8px;padding:6px 8px;white-space:nowrap}
  .question-en{font-size:22px;line-height:1.45;font-weight:760;color:#16223a}
  .question-hi{margin-top:10px;font-size:19px;line-height:1.55;font-weight:650;color:#33425d}
  .options{margin-top:22px;display:grid;gap:12px}
  .option{
    display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border:1px solid #dce3ed;
    border-radius:13px;background:#fbfcfe;cursor:pointer;transition:.18s ease;
  }
  .option:hover{border-color:#8fb0de;background:#f6f9ff}
  .option.selected{border-color:#477fc7;background:#eef5ff;box-shadow:0 0 0 3px rgba(78,161,255,.10)}
  .option-radio{width:20px;height:20px;border-radius:50%;border:2px solid #98a7bf;display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
  .option.selected .option-radio{border-color:#3d78c3}
  .option.selected .option-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#3d78c3}
  .option-text{font-size:16px;line-height:1.5;color:#1e2a40}
  .option-label{font-weight:800;color:#3f5577;margin-right:7px}
  .bottom-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid #e4e8f0}
  .left-actions,.right-actions{display:flex;gap:10px}
  .btn{padding:11px 14px;border-radius:10px;border:1px solid #d4dce9;background:#fff;color:#23324c;font-weight:800;cursor:pointer}
  .btn:hover{background:#f6f8fb}
  .btn.review{border-color:#d2bd7c;background:#fffaf0;color:#72550d}
  .btn.next{background:#162645;color:#fff;border-color:#162645}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .side-panel{padding:16px;align-self:start;position:sticky;top:94px}
  .side-title{font-size:14px;font-weight:900;color:#1a2842;letter-spacing:.4px}
  .side-sub{font-size:12px;color:#8592a8;margin-top:5px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:#65738a}
  .dot{width:12px;height:12px;border-radius:4px;border:1px solid #cbd5e4;flex:0 0 auto}
  .dot.unanswered{background:#fff}
  .dot.answered{background:#d6f6e9;border-color:#88dcb9}
  .dot.review{background:#fff2ca;border-color:#e5c666}
  .dot.answered-review{background:#dcd8ff;border-color:#a49cff}
  .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .pbtn{height:40px;border-radius:10px;border:1px solid #d7dfeb;background:#fff;color:#45526a;font-weight:800;cursor:pointer}
  .pbtn.active{outline:3px solid rgba(78,161,255,.10);border-color:#4f90e8}
  .pbtn.answered{background:#d6f6e9;border-color:#88dcb9;color:#155e45}
  .pbtn.review{background:#fff2ca;border-color:#e5c666;color:#6b5210}
  .pbtn.answered-review{background:#dcd8ff;border-color:#a49cff;color:#3f3893}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .stat{padding:10px 11px;border:1px solid #e0e6ef;border-radius:10px;background:#fafbfd}
  .stat-num{font-size:18px;font-weight:900;color:#1c2d4c}
  .stat-label{font-size:10px;color:#8995a9;margin-top:2px}
  .side-links{margin-top:18px;border-top:1px solid #e3e8f0;padding-top:15px}
  .link-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid #d9e1ed;background:#fff;color:#21314c;text-decoration:none;font-weight:800;font-size:12px;margin-top:8px}
  .link-btn:hover{background:#f5f8fd}
  .footer-note{text-align:center;padding:0 18px 20px;color:#7e8ba2;font-size:11px}
  .modal-wrap{position:fixed;inset:0;background:rgba(8,17,32,.60);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{width:min(560px,100%);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:22px}
  .modal h2{margin:0 0 8px;color:#17233b}
  .modal p{margin:8px 0;color:#59677f;line-height:1.55}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  .preview-wrap{max-width:1000px;margin:26px auto;padding:0 18px}
  .preview-title{font-size:24px;font-weight:900;color:#16233d;margin-bottom:6px}.preview-sub{color:#7a879d;margin-bottom:18px}
  .preview-card{background:#fff;border:1px solid #d9dfeb;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(24,39,72,.06)}
  .preview-q{font-weight:900;color:#1d2c47;margin-bottom:7px}.preview-en{font-size:16px;font-weight:750;line-height:1.5;color:#1c2940}.preview-hi{font-size:15px;font-weight:650;line-height:1.5;color:#52617a;margin-top:6px}
  .preview-options{display:grid;gap:7px;margin-top:10px}.preview-option{padding:9px 10px;border:1px solid #e4e8ef;border-radius:9px;color:#37445a;background:#fbfcfe}.preview-option.correct-answer{border-color:#80c9aa;background:#effaf5}.preview-option.selected-wrong{border-color:#e6a0aa;background:#fff2f4}.preview-option.selected{border-color:#80c9aa;background:#effaf5}
  .ans-line{margin-top:12px;padding:11px 12px;border-radius:10px;font-size:14px;line-height:1.45}.ans-line.correct{background:#e9f8f1;border:1px solid #9edfc3;color:#176044}.ans-line.wrong{background:#fff0f2;border:1px solid #efadb7;color:#9f2635}.ans-line.skipped{background:#f5f7fa;border:1px solid #dfe5ed;color:#68758a}
  .hidden{display:none!important}
  .start-card{max-width:760px;margin:40px auto;padding:30px;background:#fff;border-radius:18px;border:1px solid #d9dfeb;box-shadow:0 14px 40px rgba(24,39,72,.08)}
  .start-card h1{margin:0;color:#16233d;font-size:30px}
  .start-card .sub{margin-top:5px;color:#7a879d}
  .start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
  .start-stat{padding:16px;border:1px solid #e1e7ef;border-radius:12px;background:#f8fafc}
  .start-stat b{display:block;font-size:22px;color:#182a48}
  .start-stat span{font-size:11px;color:#7f8da3}
  .start-btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#162645,#243b67);color:#fff;font-weight:900;font-size:15px;cursor:pointer}
  .result{max-width:840px;margin:40px auto;background:#fff;border-radius:18px;border:1px solid #d9dfeb;box-shadow:0 14px 40px rgba(24,39,72,.08);padding:24px}
  .result h1{margin:0;color:#16233d}
  .result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .result-card{padding:16px;border:1px solid #e0e6ef;border-radius:12px;background:#fafbfd;text-align:center}
  .result-card b{display:block;font-size:24px;color:#1a2c4b}
  .result-card span{font-size:11px;color:#7c8aa0}
  .score{margin-top:18px;padding:17px;border-radius:14px;background:linear-gradient(135deg,#101c34,#182949);color:#fff;display:flex;justify-content:space-between;align-items:center}
  .score strong{font-size:30px;color:var(--gold)}
  .result-actions{display:flex;gap:10px;margin-top:18px}
  @media (max-width:900px){
    .app{min-width:980px}
    .shell{grid-template-columns:minmax(0,1fr) 320px}
    .topbar{padding:0 16px}
    .side-panel{position:sticky;top:94px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <div class="brand-title">AIIMERS CLASSES</div>
        <div class="brand-dir">Dir:- KIRTAN BAURI</div>
      </div>
    </div>
    <div class="header-right">
      <div>
        <div class="mini-label">Time Left</div>
        <div class="timer"><div class="timer-value" id="timer">08:00</div></div>
      </div>
      <button class="submit-top" id="submitTop">Submit Test</button>
    </div>
  </div>

  <main id="mainArea"></main>
  <div class="footer-note">AIIMERS CLASSES | Dir:- KIRTAN BAURI</div>
</div>

<div class="modal-wrap hidden" id="modalWrap">
  <div class="modal">
    <h2 id="modalTitle">Submit Test?</h2>
    <p id="modalText">Are you sure you want to submit the test?</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn next" id="modalConfirm">Yes, Submit</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    en:"If a uniform wire of resistance 16 Ω is cut into four equal parts and attached in parallel combination, the equivalent resistance of the combination is",
    hi:"16 Ω प्रतिरोध वाले एक समरूप तार को चार बराबर टुकड़ों में काटकर इन्हें समानान्तर क्रम में जोड़ दिया जाए तो संयोजन का समतुल्य प्रतिरोध होगा।",
    options:["1 Ω","4 Ω","1/4 Ω","1/16 Ω"], answer:1
  },
  {
    en:"Drift velocity Vd varies with the intensity of electric field E as per the relation",
    hi:"अपवाह वेग Vd किस संबंध के अनुसार विद्युत क्षेत्र E की तीव्रता के साथ बदलता रहता है?",
    options:["Vd ∝ E²","Vd ∝ 1/E","Vd ∝ √E","Vd ∝ E"], answer:4
  },
  {
    en:"A 100 watt electric bulb is connected to a 220 volt electric source. The resistance of the bulb's filament is",
    hi:"100 वाट के विद्युत बल्ब को 220 वोल्ट के विद्युत स्रोत से जोड़ा गया है। बल्ब के तंतु का प्रतिरोध है।",
    options:["484 Ω","100 Ω","22000 Ω","242 Ω"], answer:1
  },
  {
    en:"The algebraic sum of all the currents at any point in an electrical circuit is",
    hi:"विद्युत परिपथ के किसी बिन्दु पर सभी धाराओं का बीजीय योग होता है।",
    options:["positive / धनात्मक","negative / ऋणात्मक","zero / शून्य","infinite / अनन्त"], answer:3
  },
  {
    en:"In a Wheatstone bridge, if the battery and galvanometer are interchanged, then the deflection in galvanometer will",
    hi:"व्हीटस्टोन सेतु में यदि बैटरी और गैल्वेनोमीटर को आपस में बदल दिया जाए तो गैल्वेनोमीटर में विक्षेपण होगा।",
    options:["Change in previous direction","Change in opposite direction","Not change / परिवर्तन नहीं होगा","None of these"], answer:3
  },
  {
    en:"Two copper wires of length l and 2l have radii r and 2r respectively. The ratio of their specific resistances is",
    hi:"लम्बाई l तथा 2l की ताँबे के दो तारों की त्रिज्याएँ क्रमशः r तथा 2r हैं। इनके विशिष्ट प्रतिरोधों का अनुपात है।",
    options:["1:2","2:1","1:1","1:3"], answer:3
  },
  {
    en:"Kirchhoff's loop rule is a direct consequence of law of conservation of",
    hi:"किर्चहॉफ का पाश नियम किस राशि के संरक्षण के नियम की सीधी परिणति है?",
    options:["Charge / आवेश","Momentum / संवेग","Angular momentum / कोणीय संवेग","Energy / ऊर्जा"], answer:4
  },
  {
    en:"A charged particle has drift velocity 4.2 × 10⁻⁴ m s⁻¹ in electric field of 2.1 × 10⁻¹⁰ V m⁻¹. Its mobility is",
    hi:"विद्युत क्षेत्र 2.1 × 10⁻¹⁰ V m⁻¹ में एक आवेशित कण का अपवाह वेग 4.2 × 10⁻⁴ m s⁻¹ है। कण की गतिशीलता का मान है।",
    options:["0.5 × 10⁶ m²V⁻¹s⁻¹","2 × 10⁶ m²V⁻¹s⁻¹","0.5 × 10⁻⁶ m²V⁻¹s⁻¹","2 × 10⁻⁶ m²V⁻¹s⁻¹"], answer:2
  },
  {
    en:"Ohm's law is valid when the temperature of conductor is",
    hi:"ओम का नियम तब मान्य होता है जब चालक का तापमान:",
    options:["very low / बहुत कम हो","very high / बहुत अधिक हो","varying / बदल रहा हो","constant / स्थिर (नियत) हो"], answer:4
  },
  {
    en:"Why is the Wheatstone bridge more accurate than other methods of measuring resistances?",
    hi:"व्हीटस्टोन सेतु प्रतिरोध मापने की अन्य विधियों से अधिक सटीक क्यों है?",
    options:["It is a null method / यह एक शून्य-विक्षेप (null) विधि है","It is based on Kirchhoff's law / यह किर्चहॉफ के नियम पर आधारित है","It has four resistances / इसमें चार प्रतिरोध होते हैं","It does not involve Ohm's law / इसमें ओम का नियम शामिल नहीं है"], answer:1
  }
];

const EXAM_SECONDS = 8 * 60;
const NEGATIVE = 0.25;
let remaining = EXAM_SECONDS;
let current = 0;
let answers = Array(QUESTIONS.length).fill(null);
let review = Array(QUESTIONS.length).fill(false);
let submitted = false;
let timerHandle = null;
const startTime = Date.now();

const main = document.getElementById("mainArea");
const timerEl = document.getElementById("timer");
const submitTop = document.getElementById("submitTop");
const modalWrap = document.getElementById("modalWrap");
const modalCancel = document.getElementById("modalCancel");
const modalConfirm = document.getElementById("modalConfirm");

function pad(n){return String(n).padStart(2,"0")}
function formatTime(sec){return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`}

function renderStart(){
  submitTop.style.display = "none";
  document.querySelector(".timer").innerHTML = `<div class="timer-value">08:00</div>`;
  main.innerHTML = `
    <section class="start-card">
      <h1>Objective Test</h1>
      <div class="sub">Class 12 Physics • Current Electricity</div>
      <div class="start-grid">
        <div class="start-stat"><b>10</b><span>Questions</span></div>
        <div class="start-stat"><b>8:00</b><span>Time</span></div>
        <div class="start-stat"><b>−0.25</b><span>Negative Marking</span></div>
      </div>
      <div style="margin:0 0 18px;color:#58677f;line-height:1.65;font-size:14px">
        Each correct answer: +1 mark<br>
        Each wrong answer: −0.25 mark<br>
        Unattempted answer: 0 mark
      </div>
      <button class="start-btn" id="startBtn">Start Test</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">
        <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029Vb8OSjRIyPtadBvn7V3f">WhatsApp • Competitive</a>
        <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbDbZw290x2siUgnZq2i">WhatsApp • 11/12 PCMB</a>
        <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbCyz9O4inoubn71kZ26">WhatsApp • 9/10</a>
        <a class="link-btn" target="_blank" rel="noopener" href="https://t.me/kirtan0721">Telegram • @kirtan0721</a>
      </div>
    </section>`;
  document.getElementById("startBtn").onclick = startTest;
}

function statusClass(i){
  if(answers[i] !== null && review[i]) return "answered-review";
  if(review[i]) return "review";
  if(answers[i] !== null) return "answered";
  return "";
}

function renderTest(){
  submitTop.style.display = "";
  timerEl.textContent = formatTime(remaining);
  const q = QUESTIONS[current];
  main.innerHTML = `
    <section class="shell">
      <div class="main-panel">
        <div class="test-meta">
          <div class="meta-left">
            <div class="pill"><strong>Objective Test</strong></div>
            <div class="pill">Question <strong>${current+1}</strong> / ${QUESTIONS.length}</div>
            <div class="pill">+1 / −0.25</div>
          </div>
          <div class="q-number">Attempted: <strong>${answers.filter(x=>x!==null).length}</strong></div>
        </div>

        <div class="question-head">
          <div>
            <div class="q-number">Q${current+1}</div>
            <div class="question-en">${q.en}</div>
            <div class="question-hi">${q.hi}</div>
          </div>
          <div class="q-mark">1 Mark</div>
        </div>

        <div class="options">
          ${q.options.map((opt,idx)=>`
            <div class="option ${answers[current]===idx+1?'selected':''}" data-option="${idx+1}">
              <div class="option-radio"></div>
              <div class="option-text"><span class="option-label">${String.fromCharCode(65+idx)}.</span>${opt}</div>
            </div>
          `).join("")}
        </div>

        <div class="bottom-actions">
          <div class="left-actions">
            <button class="btn" id="prevBtn" ${current===0?'disabled':''}>Previous</button>
            <button class="btn review" id="reviewBtn">${review[current]?'Unmark Review':'Mark for Review'}</button>
            <button class="btn" id="clearBtn" ${answers[current]===null?'disabled':''}>Clear Response</button>
          </div>
          <div class="right-actions">
            <button class="btn next" id="nextBtn">${current===QUESTIONS.length-1?'Finish':'Next'}</button>
          </div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="side-title">Question Palette</div>
        <div class="side-sub">Attempted / skipped / review</div>
        <div class="legend">
          <div class="legend-item"><span class="dot unanswered"></span>Not Answered</div>
          <div class="legend-item"><span class="dot answered"></span>Answered</div>
          <div class="legend-item"><span class="dot review"></span>Review</div>
          <div class="legend-item"><span class="dot answered-review"></span>Answered + Review</div>
        </div>
        <div class="palette">
          ${QUESTIONS.map((_,i)=>`<button class="pbtn ${statusClass(i)} ${i===current?'active':''}" data-jump="${i}">${i+1}</button>`).join("")}
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-num">${answers.filter(x=>x!==null).length}</div><div class="stat-label">Attempted</div></div>
          <div class="stat"><div class="stat-num">${answers.filter(x=>x===null).length}</div><div class="stat-label">Skipped</div></div>
          <div class="stat"><div class="stat-num">${review.filter(Boolean).length}</div><div class="stat-label">Review</div></div>
          <div class="stat"><div class="stat-num">${QUESTIONS.length}</div><div class="stat-label">Total</div></div>
        </div>
        <div class="side-links">
          <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029Vb8OSjRIyPtadBvn7V3f">WhatsApp • Competitive</a>
          <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbDbZw290x2siUgnZq2i">WhatsApp • 11/12 PCMB</a>
          <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbCyz9O4inoubn71kZ26">WhatsApp • 9/10</a>
          <a class="link-btn" target="_blank" rel="noopener" href="https://t.me/kirtan0721">Telegram • @kirtan0721</a>
        </div>
      </aside>
    </section>`;

  document.querySelectorAll(".option").forEach(el=>{
    el.addEventListener("click",()=>{
      answers[current]=Number(el.dataset.option);
      renderTest();
    });
  });
  document.getElementById("prevBtn").onclick=()=>{ if(current>0){current--;renderTest()} };
  document.getElementById("nextBtn").onclick=()=>{
    if(current===QUESTIONS.length-1){openSubmitModal("Submit Test?","Are you sure you want to submit the test?")}
    else {current++;renderTest()}
  };
  document.getElementById("reviewBtn").onclick=()=>{review[current]=!review[current];renderTest()};
  document.getElementById("clearBtn").onclick=()=>{answers[current]=null;renderTest()};
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{current=Number(b.dataset.jump);renderTest()});
}

function startTest(){
  submitTop.style.display="";
  timerEl.textContent=formatTime(remaining);
  renderTest();
  timerHandle=setInterval(()=>{
    if(submitted) return;
    remaining--;
    timerEl.textContent=formatTime(Math.max(remaining,0));
    if(remaining<=60) timerEl.parentElement.style.borderColor="#b05a64";
    if(remaining<=0){
      clearInterval(timerHandle);
      showResult(true);
    }
  },1000);
}

function openSubmitModal(title,text){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  modalWrap.classList.remove("hidden");
}
modalCancel.onclick=()=>modalWrap.classList.add("hidden");
modalConfirm.onclick=()=>{
  modalWrap.classList.add("hidden");
  showResult(false);
};
submitTop.onclick=()=>{
  if(!submitted) openSubmitModal("Submit Test?","Are you sure you want to submit the test?");
};

function showResult(auto=false){
  if(submitted) return;
  submitted=true; clearInterval(timerHandle);
  const attempted=answers.filter(x=>x!==null).length;
  const correct=answers.reduce((n,a,i)=>n+(a===QUESTIONS[i].answer?1:0),0);
  const wrong=answers.reduce((n,a,i)=>n+(a!==null && a!==QUESTIONS[i].answer?1:0),0);
  const skipped=QUESTIONS.length-attempted;
  const score=correct-(wrong*NEGATIVE);
  const pct=Math.max(0,(score/QUESTIONS.length)*100);
  const timeTaken=Math.min(EXAM_SECONDS,EXAM_SECONDS-remaining);
  submitTop.style.display='none';
  document.querySelector('.timer').innerHTML='<div class="timer-value">00:00</div>';
  main.innerHTML=`
    <section class="result">
      <h1>Test Result</h1><div style="color:#7a879d;margin-top:6px">AIIMERS CLASSES • Dir:- KIRTAN BAURI</div>
      <div class="score"><div>${auto?'Time Over':'Test Submitted'}</div><strong>${score.toFixed(2)}</strong></div>
      <div class="result-grid">
        <div class="result-card"><b>${attempted}</b><span>Attempted</span></div><div class="result-card"><b>${correct}</b><span>Correct</span></div><div class="result-card"><b>${wrong}</b><span>Wrong</span></div><div class="result-card"><b>${skipped}</b><span>Unattempted</span></div>
      </div>
      <div class="result-grid" style="margin-top:12px">
        <div class="result-card"><b>${pct.toFixed(1)}%</b><span>Percentage</span></div><div class="result-card"><b>${formatTime(timeTaken)}</b><span>Time Used</span></div><div class="result-card"><b>−0.25</b><span>Negative Mark</span></div><div class="result-card"><b>${QUESTIONS.length}</b><span>Total Questions</span></div>
      </div>
      <div class="result-actions">
        <button class="btn next" id="previewBtn">Preview Answers</button>
        <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029Vb8OSjRIyPtadBvn7V3f">WhatsApp • Competitive</a>
        <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbDbZw290x2siUgnZq2i">WhatsApp • 11/12 PCMB</a>
        <a class="link-btn" target="_blank" rel="noopener" href="https://whatsapp.com/channel/0029VbCyz9O4inoubn71kZ26">WhatsApp • 9/10</a>
        <a class="link-btn" target="_blank" rel="noopener" href="https://t.me/kirtan0721">Telegram • @kirtan0721</a>
      </div>
    </section>`;
  document.getElementById('previewBtn').onclick=renderPreview;
}

function renderPreview(){
  main.innerHTML=`
    <section class="preview-wrap">
      <div class="preview-title">Answer Preview</div><div class="preview-sub">Correct answer and your response</div>
      ${QUESTIONS.map((q,i)=>{
        const a=answers[i]; const isCorrect=a===q.answer; const skipped=a===null;
        const statusClass=skipped?'skipped':(isCorrect?'correct':'wrong');
        const statusText=skipped?'Not Answered / अनुत्तरित':(isCorrect?'Correct / सही':'Wrong / गलत');
        const yourText=skipped?'Not Answered':`${String.fromCharCode(64+a)}. ${q.options[a-1]}`;
        const correctText=`${String.fromCharCode(64+q.answer)}. ${q.options[q.answer-1]}`;
        return `<div class="preview-card"><div class="preview-q">Q${i+1}</div><div class="preview-en">${q.en}</div><div class="preview-hi">${q.hi}</div>
          <div class="preview-options">${q.options.map((opt,j)=>{const n=j+1;let cls='';if(n===q.answer)cls=' correct-answer';if(n===a&&a!==q.answer)cls=' selected-wrong';return `<div class="preview-option${cls}"><strong>${String.fromCharCode(65+j)}.</strong> ${opt}${n===q.answer?' ✓':''}${n===a&&a!==q.answer?' ← Your Answer':''}</div>`}).join('')}</div>
          <div class="ans-line ${statusClass}"><strong>${statusText}</strong><br>Your Answer: ${yourText}<br>Correct Answer: ${correctText}</div>
        </div>`;
      }).join('')}
      <div style="margin:18px 0 30px"><button class="btn next" onclick="showResultView()">Back to Result</button></div>
    </section>`;
}

function showResultView(){ showResultSnapshot(); }
function showResultSnapshot(){
  const attempted=answers.filter(x=>x!==null).length; const correct=answers.reduce((n,a,i)=>n+(a===QUESTIONS[i].answer?1:0),0); const wrong=answers.reduce((n,a,i)=>n+(a!==null&&a!==QUESTIONS[i].answer?1:0),0); const skipped=QUESTIONS.length-attempted; const score=correct-(wrong*NEGATIVE); const pct=Math.max(0,(score/QUESTIONS.length)*100); const timeTaken=Math.min(EXAM_SECONDS,EXAM_SECONDS-remaining);
  main.innerHTML=`<section class="result"><h1>Test Result</h1><div style="color:#7a879d;margin-top:6px">AIIMERS CLASSES • Dir:- KIRTAN BAURI</div><div class="score"><div>Test Submitted</div><strong>${score.toFixed(2)}</strong></div><div class="result-grid"><div class="result-card"><b>${attempted}</b><span>Attempted</span></div><div class="result-card"><b>${correct}</b><span>Correct</span></div><div class="result-card"><b>${wrong}</b><span>Wrong</span></div><div class="result-card"><b>${skipped}</b><span>Unattempted</span></div></div><div class="result-grid" style="margin-top:12px"><div class="result-card"><b>${pct.toFixed(1)}%</b><span>Percentage</span></div><div class="result-card"><b>${formatTime(timeTaken)}</b><span>Time Used</span></div><div class="result-card"><b>−0.25</b><span>Negative Mark</span></div><div class="result-card"><b>${QUESTIONS.length}</b><span>Total Questions</span></div></div><div class="result-actions"><button class="btn next" onclick="renderPreview()">Preview Answers</button></div></section>`;
}

renderStart();
</script>
